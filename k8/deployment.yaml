apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-web
  namespace: prod
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: rag-web }
  template:
    metadata:
      labels: { app: rag-web }
    spec:
      containers:
      - name: rag-web
        image: "__IMAGE__"                      # <- Jenkins fills this in
        ports: [{ containerPort: 5000 }]
        env:
        - name: FLASK_RUN_HOST
          value: "0.0.0.0"
        - name: FLASK_RUN_PORT
          value: "5000"
        - name: FLASK_DEBUG
          value: "False"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: GEMINI_API_KEY
        readinessProbe:
          httpGet: { path: __HEALTH_PATH__, port: 5000 }   # <- Jenkins fills this in
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: __HEALTH_PATH__, port: 5000 }
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "750m"
            memory: "4Gi"
            ephemeral-storage: "1Gi"
          limits:
            cpu: "750m"
            memory: "4Gi"
            ephemeral-storage: "1Gi"
        volumeMounts:
        - name: rag-data
          mountPath: /app/chroma_scipdfs
          subPath: chroma_scipdfs
        - name: rag-data
          mountPath: /app/object_store
          subPath: object_store
      volumes:
      - name: rag-data
        persistentVolumeClaim:
          claimName: rag-data-pvc
